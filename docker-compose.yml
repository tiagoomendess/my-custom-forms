# Local MySQL for development. Matches the credentials in `.env.example` and the
# `localConnectionString` in wrangler.jsonc.
#   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_custom_forms
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
